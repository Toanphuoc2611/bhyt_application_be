spring.application.name=bhyt

# Nạp thêm file cấu hình nghiệp vụ đặt CẠNH file .exe/.jar (không bắt buộc phải có).
# Người dùng sửa file này để đổi lương cơ sở / tỷ lệ / cách tính hạn thẻ mà không build lại.
spring.config.import=optional:file:./bhyt-config.properties

# ====== Cơ sở dữ liệu SQLite ======
spring.datasource.url=jdbc:sqlite:database.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

# ====== JPA / Hibernate ======
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ====== Tham số nghiệp vụ BHYT (mặc định - bị ghi đè bởi bhyt-config.properties nếu có) ======
bhyt.luong-co-so=2530000
bhyt.muc-dong=0.045
bhyt.so-thang-mac-dinh=12
bhyt.ty-le-theo-bac=1.0,0.7,0.6,0.5,0.4
bhyt.ty-le-mstb=0.40
bhyt.the-moi-cong-them-thang=1
bhyt.the-moi-cong-them-ngay=29
bhyt.gia-han-nguong-ngay-mua-som=31

# ====== Sao lưu Excel toàn bộ dữ liệu mỗi lần khởi động server ======
bhyt.backup.enabled=true
bhyt.backup.dir=backup

# ====== Log ======
# Spring Boot tự nạp src/main/resources/logback-spring.xml
