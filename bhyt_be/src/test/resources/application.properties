# Cấu hình riêng cho test (file này SHADOW hoàn toàn application.properties chính,
# nên phải khai báo đầy đủ). Dùng DB SQLite tạm trong target/, tắt sao lưu.
spring.datasource.url=jdbc:sqlite:target/test-bhyt.db
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

bhyt.luong-co-so=2340000
bhyt.muc-dong=0.045
bhyt.backup.enabled=false
