# =====================================================================
#  CẤU HÌNH NGHIỆP VỤ BHYT
#  Đặt file này CẠNH file chạy (bhyt.exe / bhyt.jar). Sửa xong lưu lại
#  và khởi động lại chương trình - KHÔNG cần build lại.
#  Chỉ dùng số và dấu chấm thập phân. Không bỏ dấu tiếng Việt vào giá trị.
# =====================================================================

# Lương cơ sở (t) - đơn vị VNĐ. Đổi khi nhà nước điều chỉnh.
bhyt.luong-co-so=2530000

# Mức đóng (m) - 4,5% ghi là 0.045
bhyt.muc-dong=0.045

# Số tháng áp dụng khi ô "Tháng mua" để trống
bhyt.so-thang-mac-dinh=12

# Tỷ lệ đóng theo "Người thứ" trong hộ.
# Vị trí 1 = người thứ 1, ... vị trí cuối áp cho người thứ 5 trở lên.
# 1.0 = 100%, 0.7 = 70% ...
bhyt.ty-le-theo-bac=1.0,0.7,0.6,0.5,0.4

# Người có mstb: luôn dùng tỷ lệ này (bỏ qua bậc)
bhyt.ty-le-mstb=0.40

# Thẻ MỚI, gói mặc định (12 tháng): hạn thẻ = ngày mua + (12 + số này) tháng
bhyt.the-moi-cong-them-thang=1

# Thẻ MỚI, gói tùy chọn "N tháng": hạn thẻ = ngày mua + N tháng + (số này) ngày
bhyt.the-moi-cong-them-ngay=29

# Gia hạn: nếu mua sớm hơn hạn thẻ cũ quá số ngày này thì giữ nguyên hạn cũ
bhyt.gia-han-nguong-ngay-mua-som=31

# Thư mục lưu file sao lưu Excel (tạo tự động mỗi lần khởi động)
bhyt.backup.dir=backup
bhyt.backup.enabled=true
